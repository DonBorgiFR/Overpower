<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OverPower Compendio — Navega y lee los 32 capítulos del Zen traducido al lenguaje contemporáneo.">
    <title>Explorar · OverPower Zen Compendium</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/reader.css">
    <link rel="stylesheet" href="css/glossary.css">
    <link rel="stylesheet" href="css/search.css">

    <style>
        /* Page-specific small overrides */
        .nav { transform: none !important; }
    </style>
</head>
<body>

    <!-- NAV (always visible on explorar) -->
    <nav class="nav" id="nav" aria-label="Navegación principal">
        <a href="index.html" class="nav-logo">Over<em>Power</em></a>
        <ul class="nav-links">
            <li class="nav-hide-mobile"><a href="index.html#niveles">Niveles</a></li>
            <li class="nav-hide-mobile"><a href="index.html#metodo">Método</a></li>
            <li class="nav-hide-mobile">
                <button class="nav-search-btn" id="searchTrigger" aria-label="Buscar (Ctrl+K)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                    </svg>
                    Buscar <span class="srch-hint">⌘K</span>
                </button>
            </li>
            <li class="nav-hide-mobile"><a href="glosario.html">Glosario</a></li>
            <li class="nav-hide-mobile"><a href="practica.html">Práctica</a></li>
            <li class="nav-hide-mobile"><a href="progreso.html">Progreso</a></li>
            <!-- Mobile menu toggle -->
            <li>
                <button class="nav-link-btn" id="menuBtn" aria-label="Abrir navegación" aria-expanded="false">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                    <span class="nav-hide-mobile" style="margin-left:0.4rem">Capítulos</span>
                </button>
            </li>
        </ul>
    </nav>

    <!-- Reading progress bar -->
    <div class="reader-progress" aria-hidden="true">
        <div class="reader-progress-bar" id="progressBar"></div>
    </div>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <!-- ═══════ MAIN LAYOUT ═══════ -->
    <div class="explorar-layout">

        <!-- ─── SIDEBAR ─── -->
        <aside class="sidebar" id="sidebar" aria-label="Índice del compendio">

            <div class="sidebar-search">
                <div class="search-input-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input
                        type="search"
                        class="search-input"
                        id="searchInput"
                        placeholder="Buscar capítulo…"
                        aria-label="Buscar en el compendio"
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>
            </div>

            <div id="levelsContainer" role="navigation" aria-label="Capítulos por nivel">
                <!-- Built by reader.js -->
            </div>

        </aside>

        <!-- ─── READER PANEL ─── -->
        <main class="reader-panel" id="readerPanel" aria-live="polite" aria-label="Contenido del capítulo">
            <!-- Empty state / chapter content rendered by reader.js -->
        </main>

    </div>

    <script src="js/data.js"></script>
    <script src="js/reader.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
